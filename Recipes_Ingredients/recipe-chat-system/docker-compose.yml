version: '3.8'

services:
  # PostgreSQL with pgvector for recipe storage
  postgres:
    build: ./database
    container_name: recipe_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Memory optimization for PostgreSQL
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 2GB
      POSTGRES_WORK_MEM: 8MB
      POSTGRES_MAX_CONNECTIONS: 50
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama with GPU support for Llama 3.2
  ollama:
    image: ollama/ollama:latest
    container_name: recipe_ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 4g
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API with FastAPI
  backend:
    build: ./backend
    container_name: recipe_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/recipes_db
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      PYTHONUNBUFFERED: 1
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      # Memory optimization for embeddings
      SENTENCE_TRANSFORMERS_HOME: /tmp
      TRANSFORMERS_CACHE: /tmp
      WEB_CONCURRENCY: 1
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --reload

  # Frontend with Streamlit
  frontend:
    build: ./frontend
    container_name: recipe_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: 8501
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # Model loader - runs once to pull Llama model with GPU
  model_loader:
    image: ollama/ollama:latest
    container_name: recipe_model_loader
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    network_mode: "service:ollama"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        sleep 20
        export OLLAMA_HOST=http://localhost:11434
        echo "Checking if model exists..."
        if ollama list | grep -q "llama3.2:3b"; then
          echo "Model already exists"
        else
          echo "Pulling Llama 3.2:3b model with GPU acceleration..."
          ollama pull llama3.2:3b
        fi
        echo "Available models:"
        ollama list
        echo "Model loader finished!"

volumes:
  postgres_data:
  ollama_data: